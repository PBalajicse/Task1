<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Assessment Results</title>
    
    <link rel="stylesheet" href="https://jsdelivr.net">
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-4 rounded shadow" style="max-width: 600px;">
        <h2 class="text-primary mb-3">Student Skill Gap Analyzer</h2>
        <p><strong>மாணவர் பெயர்:</strong> <span th:text="${studentName}">Name</span></p>
        <p><strong>தேர்வு செய்த வேலை:</strong> <span th:text="${targetRole}">Role</span></p>
        
        <hr>
        
        
        <h4 class="mt-3">உங்களது தற்போதைய ஸ்கோர்: <span class="text-success" th:text="${score} + '%'">0%</span></h4>
        
        
        <h5 class="text-danger mt-4">உங்களிடம் இல்லாத திறன்கள் (Skill Gaps):</h5>
        <ul>
            <li th:each="skill : ${missingSkills}" th:text="${skill}">Skill Name</li>
        </ul>

        
        <h5 class="text-info mt-4">பரிந்துரைகள் (Learning Path):</h5>
        <ul>
            <li th:each="rec : ${recommendations}" th:text="${rec}">Recommendation</li>
        </ul>
        
        <a href="/" class="btn btn-secondary mt-3">மீண்டும் சோதிக்க</a>
    </div>
</body>
</html>
